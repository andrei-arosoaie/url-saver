plugins {
    id 'java'
    id 'org.springframework.boot' version '4.1.2'
    id 'com.diffplug.spotless' version '8.10.4'
}
group = 'com.know'
version = '0.1.0-SNAPSHOT'
java { toolchain { languageVersion = JavaLanguageVersion.of(27) } }
repositories { mavenCentral() }
configurations.configureEach {
    exclude group: 'org.springframework.boot', module: 'spring-boot-starter-logging'
    // Springdoc supplies the current Jakarta annotations; the SDK's legacy duplicate shadows them.
    exclude group: 'io.swagger.core.v3', module: 'swagger-annotations'
}
dependencies {
    implementation platform('org.springframework.ai:spring-ai-bom:2.0.2')
    implementation 'org.springframework.ai:spring-ai-openai'
    implementation 'org.jsoup:jsoup:1.23.2'
    implementation enforcedPlatform('org.springframework.boot:spring-boot-dependencies:4.1.2')
    annotationProcessor platform('org.springframework.boot:spring-boot-dependencies:4.1.2')
    compileOnly platform('org.springframework.boot:spring-boot-dependencies:4.1.2')
    testImplementation platform('org.springframework.boot:spring-boot-dependencies:4.1.2')
    implementation 'org.springframework.boot:spring-boot-starter-webmvc'
    implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:3.1.1'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.security:spring-security-core'
    implementation 'com.googlecode.owasp-java-html-sanitizer:owasp-java-html-sanitizer:20261011.1'
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    implementation 'org.springframework.boot:spring-boot-starter-log4j2'
    implementation 'io.imagekit:image-kit-java:3.0.0'
    implementation 'org.springframework.boot:spring-boot-starter-flyway'
    implementation 'org.flywaydb:flyway-database-postgresql'
    runtimeOnly 'org.postgresql:postgresql'
    implementation 'org.mapstruct:mapstruct:1.6.3'
    compileOnly 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'
    annotationProcessor 'org.mapstruct:mapstruct-processor:1.6.3'
    annotationProcessor 'org.projectlombok:lombok-mapstruct-binding:0.2.0'
    annotationProcessor 'org.springframework.boot:spring-boot-configuration-processor'
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testCompileOnly 'org.projectlombok:lombok'
    testAnnotationProcessor platform('org.springframework.boot:spring-boot-dependencies:4.1.2')
    testAnnotationProcessor 'org.projectlombok:lombok'
    testImplementation 'com.tngtech.archunit:archunit-junit5:1.5.1'
    testImplementation 'org.testcontainers:testcontainers-postgresql'
    testImplementation 'org.testcontainers:testcontainers-junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}
sourceSets {
    main { resources.srcDir layout.buildDirectory.dir('webapp-resources') }
    integrationTest {
        compileClasspath += sourceSets.main.output
        runtimeClasspath += sourceSets.main.output
    }
}

def webappEntry = layout.projectDirectory.file('../webapp/dist/index.html')
tasks.register('verifyWebappBuild') {
    inputs.file(webappEntry).optional()
    doLast {
        if (!webappEntry.asFile.exists()) throw new GradleException('Build the webapp first: cd webapp && npm ci && npm run build')
    }
}
tasks.register('syncWebapp', Sync) {
    dependsOn 'verifyWebappBuild'
    from '../webapp/dist'
    into layout.buildDirectory.dir('webapp-resources/static')
}
tasks.named('processResources') { dependsOn 'syncWebapp' }
configurations {
    integrationTestImplementation.extendsFrom testImplementation
    integrationTestRuntimeOnly.extendsFrom testRuntimeOnly
    integrationTestCompileOnly.extendsFrom testCompileOnly
    integrationTestAnnotationProcessor.extendsFrom testAnnotationProcessor
}
tasks.withType(Test).configureEach {
    useJUnitPlatform()
    testLogging { events 'passed', 'skipped', 'failed'; exceptionFormat 'full' }
}
tasks.named('test', Test) {
    include '**/*Test.class'
}
tasks.register('integrationTest', Test) {
    include '**/*IT.class'
    description = 'Runs PostgreSQL Testcontainers integration tests; Docker is required.'
    group = 'verification'
    testClassesDirs = sourceSets.integrationTest.output.classesDirs
    classpath = sourceSets.integrationTest.runtimeClasspath
    shouldRunAfter test
    outputs.file(layout.buildDirectory.file('openapi/openapi.yaml'))
}

tasks.register('identificationBrowserPreview', JavaExec) {
    description = 'Starts a disposable PostgreSQL/AI fixture preview for browser verification; no production configuration is loaded.'
    group = 'verification'
    dependsOn integrationTestClasses
    classpath = sourceSets.integrationTest.runtimeClasspath
    mainClass = 'com.know.support.IdentificationBrowserPreview'
}

tasks.register('exportOpenApi', Copy) {
    description = 'Exports Springdoc YAML from the real HTTP integration server to the checked-in contract.'
    group = 'documentation'
    dependsOn integrationTest
    from layout.buildDirectory.file('openapi/openapi.yaml')
    into 'openapi'
}

def generatedOpenApi = layout.buildDirectory.file('openapi/openapi.yaml')
def committedOpenApi = layout.projectDirectory.file('openapi/openapi.yaml')
tasks.register('verifyOpenApi') {
    description = 'Fails if the checked-in OpenAPI YAML differs from the running backend.'
    group = 'verification'
    dependsOn integrationTest
    inputs.file(generatedOpenApi)
    inputs.file(committedOpenApi).optional()
    doLast {
        def generated = generatedOpenApi.get().asFile
        def committed = committedOpenApi.asFile
        if (!committed.exists() || generated.getText('UTF-8').replace('\r\n', '\n') != committed.getText('UTF-8').replace('\r\n', '\n')) {
            throw new GradleException('OpenAPI contract drift: run ./gradlew exportOpenApi, review and commit server/openapi/openapi.yaml.')
        }
    }
}

tasks.register('verifyTestNames') {
    description = 'Checks integration IT suffixes and regular Test suffixes.'
    group = 'verification'
    inputs.files(fileTree('src/test/java') {
        include '**/*.java'
    }, fileTree('src/integrationTest/java') {
        include '**/*.java'
    })
    doLast { task ->
        def invalid = task.inputs.files.files.findAll { source ->
            def containsTests = source.getText('UTF-8') =~ /@(Test|ParameterizedTest|RepeatedTest|TestFactory|TestTemplate|Nested)\b/
            if (!containsTests.find()) return false
            def integration = source.path.replace('\\', '/').contains('/integrationTest/')
            integration ? !source.name.endsWith('IT.java') : !source.name.endsWith('Test.java')
        }
        if (!invalid.empty) throw new GradleException('Invalid test names: ' + invalid*.name.join(', '))
    }
}
tasks.withType(Test).configureEach { dependsOn 'verifyTestNames' }

tasks.named('check') { dependsOn integrationTest, verifyOpenApi }

tasks.named('bootJar') { archiveFileName = 'know-server.jar' }
tasks.withType(JavaCompile).configureEach {
    options.compilerArgs += ['-parameters']
    if (name == 'compileJava') {
        options.compilerArgs += [
            '-Amapstruct.defaultComponentModel=spring',
            '-Amapstruct.unmappedTargetPolicy=ERROR'
        ]
    }
}
spotless {
    lineEndings = com.diffplug.spotless.LineEnding.UNIX
    java { target 'src/**/*.java'; googleJavaFormat('1.36.0') }
    groovyGradle { target '*.gradle'; greclipse(); leadingTabsToSpaces(4) }
    format('misc') {
        target '*.md', 'src/**/*.yml', 'src/**/*.sql'; trimTrailingWhitespace(); endWithNewline()
    }
}
