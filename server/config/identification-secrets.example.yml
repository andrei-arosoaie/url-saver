# Loaded automatically from ./config/identification-secrets.yml when running from server/.
# Copy this file to identification-secrets.yml and supply both keys.
# Do not commit API keys.
know:
  identification:
    enabled: true
    provider-order:
      - openrouter
      - groq
    consecutive-failure-threshold: 3
    provider-cooldown: 1d
    providers:
      openrouter:
        api-key: "YOUR_OPENROUTER_API_KEY"
        model: openrouter/free
      groq:
        api-key: "YOUR_GROQ_API_KEY"
        model: openai/gpt-oss-120b
