# Phase 11 movie catalog configuration.
# Copy to movie-secrets.yml and supply the project API key.
# Loaded from ./config locally and /etc/secrets on Render.
# These properties are the configuration contract for the upcoming implementation.
know:
  movies:
    enabled: false
    provider: thetvdb
    language: eng
    thetvdb:
      api-key: "YOUR_THETVDB_PROJECT_API_KEY"
    autocomplete:
      minimum-characters: 2
      debounce-ms: 300
      page-size: 8
    cache:
      search-ttl: 24h
      empty-search-ttl: 15m
      details-ttl: 7d
      stale-ttl: 30d
      cursor-ttl: 24h
    http:
      connect-timeout: 2s
      request-timeout: 10s
      max-response-bytes: 2097152
      max-concurrent-requests: 2
    # Confirm the live request budget against your project's granted terms.
    rate-limit:
      requests-per-second: 1
      burst: 1
    worker:
      tick: 5s
      lease-duration: 60s
      retry-delays: [30s, 2m, 10m]
      failure-cooldown: 1h
      authentication-failure-cooldown: 5m
      completed-job-retention: 7d
      cleanup-batch-size: 200
