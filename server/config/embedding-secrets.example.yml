# Copy to embedding-secrets.yml and fill in your Gemini API key locally.
# Never commit real credentials. Live requests stay disabled until explicitly enabled.
# Loaded from ./config/embedding-secrets.yml locally or /etc/secrets on Render.
know:
  connections:
    enabled: false
    embedding:
      provider: google
      model: gemini-embedding-001
      live-requests-enabled: false
      # Confirm the project is unbilled and applicable Google terms before enabling.
      # This is an operator safeguard, not a Google API billing switch.
      unbilled-project-confirmed: false
      gemini:
        api-key: ""
