# Copy to imagekit-secrets.yml and enter credentials locally. Never commit real keys.
# Loaded by the Phase 4 application from ./config/imagekit-secrets.yml.
know:
  screenshots:
    provider: imagekit
    signed-url-ttl: 30m
    imagekit:
      private-key: ADD_IMAGEKIT_PRIVATE_KEY
      url-endpoint: https://ik.imagekit.io/YOUR_IMAGEKIT_ID
