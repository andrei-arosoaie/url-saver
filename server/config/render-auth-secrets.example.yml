# Phase 9 identity configuration; required at application startup.
# Upload completed actual file as Render secret file "auth-secrets.yml".
spring:
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: "CHANGE_ME.apps.googleusercontent.com"
            client-secret: "CHANGE_ME"
            scope: [openid, profile, email]
            redirect-uri: "https://url-saver-server.onrender.com/login/oauth2/code/google"
know:
  identity:
    issuer: "https://url-saver-server.onrender.com"
    web-origin: "https://url-saver-server.onrender.com"
    extension-id: "know@url-saver.local"
    extension-client-id: "know-firefox"
    extension-redirect-uri: "GENERATED_FROM_EXTENSION_ID"
    web-redirect-uri: "https://url-saver-server.onrender.com/auth/callback"
    signing:
      key-id: "know-production-1"
      private-key: "file:/etc/secrets/auth-private-key.pem"
      public-key: "file:/etc/secrets/auth-public-key.pem"
    access-token-lifetime: 24h
    refresh-window: 24h
    refresh-expiry-mode: from-sign-in
    cookie:
      secure: true
      same-site: Lax
    legacy-account:
      id: "00000000-0000-4000-8000-000000000001"
      owner-email: "CHANGE_ME"
