# Phase 9 identity configuration; required at application startup.
# Local development. Fill Google values from a Web application OAuth client.
spring:
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: "CHANGE_ME.apps.googleusercontent.com"
            client-secret: "CHANGE_ME"
            scope: [openid, profile, email]
            redirect-uri: "http://localhost:8080/login/oauth2/code/google"
know:
  identity:
    issuer: "http://localhost:8080"
    web-origin: "http://localhost:5173"
    extension-id: "know@url-saver.local"
    extension-client-id: "know-firefox"
    # Filled by scripts/prepare-auth-config.mjs from the manifest's stable ID.
    extension-redirect-uri: "GENERATED_FROM_EXTENSION_ID"
    web-redirect-uri: "http://localhost:5173/auth/callback"
    signing:
      key-id: "know-local-1"
      private-key: "file:./config/auth-private-key.pem"
      public-key: "file:./config/auth-public-key.pem"
    access-token-lifetime: 24h
    refresh-window: 24h
    refresh-expiry-mode: from-sign-in
    cookie:
      secure: false
      same-site: Lax
    # One-time migration must verify Google ownership; email alone is not identity.
    legacy-account:
      id: "00000000-0000-4000-8000-000000000001"
      owner-email: "CHANGE_ME"
