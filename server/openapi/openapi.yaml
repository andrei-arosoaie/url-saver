        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
          description: UNAUTHENTICATED when temporary account mode is disabled.
        "404":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
          description: RESOURCE_NOT_FOUND for a missing or foreign-owned parent/record;
