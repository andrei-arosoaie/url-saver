openapi: 3.1.0
info:
  description: "Save, update and read account-owned articles. Real authentication\
    \ is implemented in the security checkpoint."
  title: Know Article API
  version: v1
servers:
- url: /
security:
- knowBearer: []
paths:
  /api/v1/articles:
    get:
      description: "Newest first by savedAt descending, then UUID descending. Optional\
        \ category and literal case-insensitive query over title, URL and entityName;\
        \ filtering happens before pagination. No HTML or total count. Send nextCursor\
        \ unchanged with the same filters; null means the end. A cursor grants no\
        \ account access. Initial pagination defaults are configurable."
      operationId: listArticles
      parameters:
      - in: query
        name: limit
        required: false
        schema:
          type: integer
          format: int32
          default: 20
          maximum: 100
          minimum: 1
      - description: Opaque bookmark from the preceding page.
        in: query
        name: cursor
        required: false
        schema:
          type: string
          maxLength: 256
      - in: query
        name: category
        required: false
        schema:
          type: string
      - in: query
        name: query
        required: false
        schema:
          type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ArticlePageResponse"
          description: Owned summaries and the next bookmark.
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
          description: Invalid request or cursor.
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
          description: Sign-in required.
        "500":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
          description: Unexpected failure; hash collisions use URL_HASH_COLLISION.
      summary: List saved article summaries
      tags:
      - Articles
    post:
      description: Exact URL matching within the current account. Automatically enrich
        missing content; never overwrite saved text. Configurable content limit defaults
        to 4 MiB UTF-8 on input and sanitized output; title limit defaults to 1000
        Unicode code points. No truncation. Duplicate content requires explicit PATCH
        confirmation.
      operationId: saveArticle
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SaveArticleRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SaveArticleResponse"
          description: ENRICHED missing content or UNCHANGED existing save.
        "201":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SaveArticleResponse"
          description: CREATED; Location points to the saved article.
          headers:
            Location:
              schema:
                type: string
              style: simple
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
          description: Invalid request or cursor.
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
          description: Sign-in required.
        "409":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
          description: DUPLICATE_URL; existingArticleId identifies the saved article.
            Nothing overwritten.
        "413":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
          description: CONTENT_TOO_LARGE; nothing saved.
        "500":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
          description: Unexpected failure; hash collisions use URL_HASH_COLLISION.
      summary: Save an article
      tags:
      - Articles
  /api/v1/articles/{articleId}/entities:
    get:
      description: Newest entity createdAt/UUID first. Owner/article-bound cursor;
        validate parent ownership even for an empty list.
      operationId: listArticleEntities
      parameters:
      - in: path
        name: articleId
        required: true
        schema:
          type: string
          format: uuid
      - in: query
        name: limit
        required: false
        schema:
          type: integer
          format: int32
      - in: query
        name: cursor
        required: false
        schema:
          type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EntityPageResponseLinkedEntityResponse"
          description: Successful owned response.
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
          description: INVALID_REQUEST or INVALID_ENTITY_STATUS; no partial changes.
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
          description: UNAUTHENTICATED when temporary account mode is disabled.
        "404":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
          description: RESOURCE_NOT_FOUND for a missing or foreign-owned parent/record;
            no ownership disclosure.
        "409":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
          description: VERSION_CONFLICT requires reload; DUPLICATE_ENTITY includes
            existingEntityId. No automatic overwrite.
        "500":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
          description: Unexpected failure; ENTITY_TITLE_HASH_COLLISION never reuses
            a different full title.
      summary: Read entities linked to an owned article
      tags:
      - Article entities
    post:
      description: 201 CREATED for a new entity; 200 LINKED or UNCHANGED for exact
        owner/type/title reuse. Preserve existing status/history. No automatic extraction
        or metadata-driven relinking.
      operationId: addArticleEntity
      parameters:
      - in: path
        name: articleId
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AddArticleEntityRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AddEntityResponse"
          description: Existing entity reused; link created or unchanged.
        "201":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AddEntityResponse"
          description: Entity created and linked.
          headers:
            Location:
              schema:
                type: string
              style: simple
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
          description: INVALID_REQUEST or INVALID_ENTITY_STATUS; no partial changes.
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
          description: UNAUTHENTICATED when temporary account mode is disabled.
        "404":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
          description: RESOURCE_NOT_FOUND for a missing or foreign-owned parent/record;
            no ownership disclosure.
        "409":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
          description: VERSION_CONFLICT requires reload; DUPLICATE_ENTITY includes
            existingEntityId. No automatic overwrite.
        "500":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
          description: Unexpected failure; ENTITY_TITLE_HASH_COLLISION never reuses
            a different full title.
      summary: Explicitly add an identified entity
      tags:
      - Article entities
  /api/v1/articles/{articleId}/entities/{entityId}:
    delete:
      description: "Both parents must be owned. Preserve entity, article, history\
        \ and all other source links. Repeated unlink returns 204. No entity-delete\
        \ endpoint."
      operationId: unlinkArticleEntity
      parameters:
      - in: path
        name: articleId
        required: true
        schema:
          type: string
          format: uuid
      - in: path
        name: entityId
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "204":
          description: Association removed or already absent.
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
          description: INVALID_REQUEST or INVALID_ENTITY_STATUS; no partial changes.
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
          description: UNAUTHENTICATED when temporary account mode is disabled.
        "404":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
          description: RESOURCE_NOT_FOUND for a missing or foreign-owned parent/record;
            no ownership disclosure.
        "409":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
          description: VERSION_CONFLICT requires reload; DUPLICATE_ENTITY includes
            existingEntityId. No automatic overwrite.
        "500":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
          description: Unexpected failure; ENTITY_TITLE_HASH_COLLISION never reuses
            a different full title.
      summary: Unlink only this article/entity pair
      tags:
      - Article entities
    put:
      description: "201 for a new pair, 200 for an existing pair. Preserve original\
        \ linkedAt and both records."
      operationId: linkArticleEntity
      parameters:
      - in: path
        name: articleId
        required: true
        schema:
          type: string
          format: uuid
      - in: path
        name: entityId
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EntityLinkResponse"
          description: Association already exists.
        "201":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EntityLinkResponse"
          description: Association created.
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
          description: INVALID_REQUEST or INVALID_ENTITY_STATUS; no partial changes.
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
          description: UNAUTHENTICATED when temporary account mode is disabled.
        "404":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
          description: RESOURCE_NOT_FOUND for a missing or foreign-owned parent/record;
            no ownership disclosure.
        "409":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
          description: VERSION_CONFLICT requires reload; DUPLICATE_ENTITY includes
            existingEntityId. No automatic overwrite.
        "500":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
          description: Unexpected failure; ENTITY_TITLE_HASH_COLLISION never reuses
            a different full title.
      summary: Link an existing owned entity
      tags:
      - Article entities
  /api/v1/articles/{articleId}/screenshot:
    get:
      operationId: getArticleScreenshot
      parameters:
      - in: path
        name: articleId
        required: true
        schema:
          type: string
          format: uuid
      - in: query
        name: refresh
        required: false
        schema:
          type: boolean
          default: false
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ScreenshotResponse"
          description: AVAILABLE or MISSING; signed URLs expire after the configured
            lifetime.
      summary: Read an owned screenshot and temporary private download URL
      tags:
      - screenshot-controller
    put:
      description: "metadata is JSON with captureId and expectedVersion. file is a\
        \ native PNG; omit to record an unavailable capture. Backend transforms to\
        \ its configured JPEG/PNG, retaining native dimensions. Reuse captureId and\
        \ identical bytes for retries. Ownership, version and capture checks prevent\
        \ automatic overwrite by stale requests. Article saves are independent."
      operationId: uploadArticleScreenshot
      parameters:
      - in: path
        name: articleId
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file:
                  type: string
                  format: binary
                metadata:
                  $ref: "#/components/schemas/ScreenshotRequest"
              required:
              - metadata
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ScreenshotResponse"
          description: AVAILABLE or explicitly MISSING
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ScreenshotResponse"
          description: Invalid metadata or PNG
        "404":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ScreenshotResponse"
          description: Missing or foreign article
        "409":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ScreenshotResponse"
          description: "Stale version, superseded capture or changed bytes"
        "413":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ScreenshotResponse"
          description: "Upload, stored image or decoded pixels exceed configured limits"
        "503":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ScreenshotResponse"
          description: Retryable screenshot upload/provider failure; article remains
            saved
      summary: Upload native PNG separately from an already saved article
      tags:
      - screenshot-controller
  /api/v1/articles/{id}:
    delete:
      description: "Expected version required in query. Removes article, entity associations\
        \ and screenshot metadata; durably queues provider file cleanup. Entities\
        \ and completion history remain. Client confirms deletion first. Missing/foreign\
        \ articles return 404; stale version returns 409 VERSION_CONFLICT."
      operationId: deleteArticle
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
          format: uuid
      - in: query
        name: version
        required: true
        schema:
          type: integer
          format: int64
      responses:
        "204":
          description: Article deleted; remote screenshot cleanup queued durably.
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
          description: Invalid request or cursor.
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
          description: Sign-in required.
        "500":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
          description: Unexpected failure; hash collisions use URL_HASH_COLLISION.
      summary: Permanently delete an owned article
      tags:
      - Articles
    get:
      description: "Returns sanitized HTML, or null content for a link-only save."
      operationId: getArticle
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ArticleResponse"
          description: Owned article.
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
          description: Invalid request or cursor.
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
          description: Sign-in required.
        "404":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
          description: Missing article or another account owns it; same response.
        "500":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
          description: Unexpected failure; hash collisions use URL_HASH_COLLISION.
      summary: Read an owned article
      tags:
      - Articles
    patch:
      description: "Send the version read previously and title, content, category\
        \ and/or entityName. Omitted fields stay unchanged; explicit null clears only\
        \ entityName. Category must be enabled for the account. Editing entityName\
        \ never changes entity links. Null/blank content, URL changes and unknown\
        \ fields are rejected. Version increments only for actual changes; no automatic\
        \ conflict retry. The same configurable title/content limits apply."
      operationId: updateArticle
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateArticleRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ArticleResponse"
          description: "Current article, including version."
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
          description: Invalid request or cursor.
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
          description: Sign-in required.
        "404":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
          description: Missing article or another account owns it; same response.
        "409":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
          description: VERSION_CONFLICT; reload before another explicit update.
        "413":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
          description: CONTENT_TOO_LARGE; no changes committed.
        "500":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
          description: Unexpected failure; hash collisions use URL_HASH_COLLISION.
      summary: Explicitly update an article
      tags:
      - Articles
  /api/v1/categories:
    get:
      description: "Includes enabled and disabled categories. Stable keys, editable\
        \ names/colors, current article counts, and optimistic versions. Seeding preserves\
        \ edited defaults."
      operationId: listCategories
      responses:
        "400":
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
          description: "INVALID_REQUEST; invalid name, color, version or JSON fields."
        "401":
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
          description: UNAUTHENTICATED.
        "404":
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
          description: RESOURCE_NOT_FOUND for missing or foreign category.
        "409":
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
          description: "VERSION_CONFLICT, DUPLICATE_CATEGORY_NAME, CATEGORY_IN_USE,\
            \ CATEGORY_REQUIRED or DEFAULT_CATEGORY_PROTECTED. Nothing changed."
      summary: List owned categories with article counts
      tags:
      - Categories
    post:
      description: "Unique account name ignoring case and surrounding whitespace;\
        \ configurable name limit defaults to 100 Unicode code points. Color uses\
        \ #RRGGBB."
      operationId: createCategory
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateCategoryRequest"
        required: true
      responses:
        "201":
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/CategoryResponse"
          description: "Created category, including stable key, version and articleCount."
        "400":
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
          description: "INVALID_REQUEST; invalid name, color, version or JSON fields."
        "401":
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
          description: UNAUTHENTICATED.
        "404":
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
          description: RESOURCE_NOT_FOUND for missing or foreign category.
        "409":
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
          description: "VERSION_CONFLICT, DUPLICATE_CATEGORY_NAME, CATEGORY_IN_USE,\
            \ CATEGORY_REQUIRED or DEFAULT_CATEGORY_PROTECTED. Nothing changed."
      summary: Create an owned custom category
      tags:
      - Categories
  /api/v1/categories/{key}:
    delete:
      description: Version required in query. Referenced categories and predefined
        categories cannot be removed. Missing and foreign keys return the same 404.
      operationId: deleteCategory
      parameters:
      - in: path
        name: key
        required: true
        schema:
          type: string
      - in: query
        name: version
        required: true
        schema:
          type: integer
          format: int64
      responses:
        "204":
          description: Category permanently removed.
        "400":
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
          description: "INVALID_REQUEST; invalid name, color, version or JSON fields."
        "401":
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
          description: UNAUTHENTICATED.
        "404":
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
          description: RESOURCE_NOT_FOUND for missing or foreign category.
        "409":
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
          description: "VERSION_CONFLICT, DUPLICATE_CATEGORY_NAME, CATEGORY_IN_USE,\
            \ CATEGORY_REQUIRED or DEFAULT_CATEGORY_PROTECTED. Nothing changed."
      summary: Remove an empty custom category
      tags:
      - Categories
    patch:
      description: "Expected JSON version required. Omitted fields remain unchanged;\
        \ null/unknown fields rejected. Names/colors editable for all categories.\
        \ Cannot disable a category containing articles, or the OTHER fallback. No-op\
        \ preserves version."
      operationId: editCategory
      parameters:
      - in: path
        name: key
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EditCategoryRequest"
        required: true
      responses:
        "400":
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
          description: "INVALID_REQUEST; invalid name, color, version or JSON fields."
        "401":
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
          description: UNAUTHENTICATED.
        "404":
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
          description: RESOURCE_NOT_FOUND for missing or foreign category.
        "409":
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
          description: "VERSION_CONFLICT, DUPLICATE_CATEGORY_NAME, CATEGORY_IN_USE,\
            \ CATEGORY_REQUIRED or DEFAULT_CATEGORY_PROTECTED. Nothing changed."
      summary: "Edit, disable or re-enable an owned category"
      tags:
      - Categories
  /api/v1/entities:
    get:
      description: "Newest createdAt/UUID first. Literal case-insensitive title search;\
        \ status must belong to type. completionYear uses UTC completion history,\
        \ independent of current status. Cursors are owner/filter-bound. Default 20/max\
        \ 100; configurable in YAML."
      operationId: listEntities
      parameters:
      - in: query
        name: type
        required: true
        schema:
          type: string
          enum:
          - BOOK
          - MOVIE
          - TV_SHOW
          - GAME
      - in: query
        name: query
        required: false
        schema:
          type: string
      - in: query
        name: status
        required: false
        schema:
          type: string
      - in: query
        name: completionYear
        required: false
        schema:
          type: integer
          format: int32
      - in: query
        name: limit
        required: false
        schema:
          type: integer
          format: int32
      - in: query
        name: cursor
        required: false
        schema:
          type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EntityPageResponseEntitySummaryResponse"
          description: Successful owned response.
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
          description: INVALID_REQUEST or INVALID_ENTITY_STATUS; no partial changes.
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
          description: UNAUTHENTICATED when temporary account mode is disabled.
        "404":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
          description: RESOURCE_NOT_FOUND for a missing or foreign-owned parent/record;
            no ownership disclosure.
        "409":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
          description: VERSION_CONFLICT requires reload; DUPLICATE_ENTITY includes
            existingEntityId. No automatic overwrite.
        "500":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
          description: Unexpected failure; ENTITY_TITLE_HASH_COLLISION never reuses
            a different full title.
      summary: List one entity type
      tags:
      - Entities
    post:
