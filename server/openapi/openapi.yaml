components:
  schemas:
    AddArticleEntityRequest:
      type: object
      additionalProperties: false
      properties:
        title:
          type: string
        type:
          type: string
          enum:
          - BOOK
          - MOVIE
          - TV_SHOW
          - GAME
      required:
      - title
      - type
    AddCompletionRequest:
      type: object
      additionalProperties: false
      properties:
        completedAt:
          type: string
          format: date-time
        version:
          type: integer
          format: int64
          minimum: 0
      required:
      - version
    AddCompletionResponse:
      type: object
      properties:
        completion:
          $ref: "#/components/schemas/CompletionResponse"
        entity:
          $ref: "#/components/schemas/EntityResponse"
      required:
      - completion
      - entity
    AddEntityResponse:
      type: object
      properties:
        entity:
          $ref: "#/components/schemas/EntityResponse"
        link:
          $ref: "#/components/schemas/EntityLinkResponse"
        outcome:
          type: string
          enum:
          - CREATED
          - LINKED
          - UNCHANGED
      required:
      - entity
      - link
      - outcome
    ApiErrorResponse:
      type: object
      description: Spring Boot default error JSON with optional application reason
        and duplicate resource ID.
      properties:
        error:
          type: string
        existingArticleId:
          type: string
          format: uuid
          description: Present only for DUPLICATE_URL.
        existingEntityId:
          type: string
          format: uuid
          description: Present only for DUPLICATE_ENTITY.
        message:
          type: string
        path:
          type: string
        reason:
          type: string
          description: "INVALID_REQUEST, INVALID_ENTITY_STATUS, UNAUTHENTICATED, ARTICLE_NOT_FOUND,\
            \ RESOURCE_NOT_FOUND, DUPLICATE_URL, DUPLICATE_ENTITY, VERSION_CONFLICT,\
            \ CONTENT_TOO_LARGE, DUPLICATE_CATEGORY_NAME, CATEGORY_IN_USE, CATEGORY_REQUIRED,\
            \ DEFAULT_CATEGORY_PROTECTED, URL_HASH_COLLISION or ENTITY_TITLE_HASH_COLLISION."
        status:
          type: integer
          format: int32
        timestamp:
          type: string
          format: date-time
      required:
      - error
      - path
      - status
      - timestamp
    ArticlePageResponse:
