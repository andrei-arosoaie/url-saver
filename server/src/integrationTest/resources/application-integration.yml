spring:
  application:
    name: know-integration-test
  jackson:
    deserialization:
      fail-on-unknown-properties: true
      accept-float-as-int: false
  threads:
    virtual:
      enabled: true
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate.jdbc.time_zone: UTC
  flyway:
    enabled: true
know:
  temporary-account:
    enabled: true
  articles:
    max-content-bytes: 4194304
    max-title-code-points: 1000
springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true
  paths-to-match: /api/v1/articles/**
  writer-with-order-by-keys: true
  override-with-generic-response: false
