spring:
  application:
    name: know
  jackson:
    deserialization:
      fail-on-unknown-properties: true
      accept-float-as-int: false
  config:
    import: file:./config/secrets.yml
  threads:
    virtual:
      enabled: true
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate.jdbc.time_zone: UTC
  flyway:
    enabled: true
logging:
  structured:
    format:
      console: ecs
know:
  articles:
    max-content-bytes: 4194304
    max-title-code-points: 1000
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
      group:
        liveness:
          include: livenessState
      probes:
        enabled: true
