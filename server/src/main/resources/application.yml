server:
  address: 0.0.0.0
  port: ${PORT:8080}
spring:
  datasource:
    hikari:
      connection-init-sql: SET search_path TO public, extensions
  application:
    name: know
  jackson:
    deserialization:
      fail-on-unknown-properties: true
      accept-float-as-int: false
  config:
    import: file:./config/secrets.yml,optional:file:./config/imagekit-secrets.yml,optional:file:./config/identification-secrets.yml,optional:file:./config/embedding-secrets.yml,optional:file:/etc/secrets/embedding-secrets.yml
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 21MB
  threads:
    virtual:
      enabled: true
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate.jdbc.time_zone: UTC
  flyway:
    enabled: true
logging:
  structured:
    format:
      console: ecs
know:
  categories:
    max-name-code-points: 100
  screenshots:
    provider: imagekit
    format: jpeg
    jpeg-quality: 90
    max-upload-bytes: 20971520
    max-stored-bytes: 5242880
    max-decoded-pixels: 16777216
    signed-url-ttl: 30m
    signed-url-cache-entries: 1000
  entities:
    max-title-code-points: 1000
  pagination:
    default-limit: 20
    max-limit: 100
  temporary-account:
    # Temporary shared account for the current functionality-only iteration.
    enabled: true
    id: 00000000-0000-4000-8000-000000000001
  articles:
    max-content-bytes: 4194304
    max-title-code-points: 1000
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
      group:
        liveness:
          include: livenessState
      probes:
        enabled: true
springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false
  paths-to-match: /api/v1/**
  writer-with-order-by-keys: true
  override-with-generic-response: false
