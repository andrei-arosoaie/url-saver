services:
  postgres:
    image: postgres:17.11-alpine
    ports:
      - "127.0.0.1:5432:5432"
    environment:
      POSTGRES_DB: know
      POSTGRES_USER: know
      POSTGRES_PASSWORD: ${KNOW_LOCAL_DATABASE_PASSWORD:?Set a local development database password}
    volumes:
      - know-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U know -d know"]
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  know-postgres:
