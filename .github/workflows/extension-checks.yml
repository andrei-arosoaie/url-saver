name: Firefox extension checks
on:
  pull_request:
    paths:
      - 'extension/firefox/**'
      - 'server/openapi/openapi.yaml'
      - '.github/workflows/extension-checks.yml'
  push:
    paths:
      - 'extension/firefox/**'
      - 'server/openapi/openapi.yaml'
      - '.github/workflows/extension-checks.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: extension/firefox
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 'lts/*'
          cache: npm
          cache-dependency-path: extension/firefox/package-lock.json
      - run: npm ci
      - run: npm run check
      - run: npm run validate
