name: Firefox extension checks
on:
  pull_request:
    paths:
      - 'extension/firefox/**'
      - 'server/openapi/openapi.yaml'
      - '.github/workflows/extension-checks.yml'
  push:
    paths:
      - 'extension/firefox/**'
      - 'server/openapi/openapi.yaml'
      - '.github/workflows/extension-checks.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: extension/firefox
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 'lts/*'
          cache: npm
          cache-dependency-path: extension/firefox/package-lock.json
      - run: npm ci
      - run: npm run check
      - run: npm run validate
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad
        with:
          distribution: temurin
          java-version: '27'
          cache: gradle
      - name: Build the real backend and webapp for integration tests
        run: |
          npm ci --prefix ../../webapp
          npm run build --prefix ../../webapp
          cd ../../server
          sh ./gradlew --no-daemon bootJar
          docker build --platform linux/amd64 --tag know-firefox-it .
      - name: Verify extension saves, screenshot uploads and retries through HTTP and PostgreSQL
        working-directory: server
        env:
          KNOW_RUN_EXTENSION_IT: '1'
        run: sh scripts/verify-image.sh know-firefox-it
